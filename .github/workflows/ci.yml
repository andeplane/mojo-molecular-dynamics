name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Magic
        run: |
          curl -ssL https://magic.modular.com | bash
          echo "$HOME/.magic/bin" >> $GITHUB_PATH

      - name: Install Mojo
        run: magic install

      - name: Run unit and integration tests
        run: magic run mojo test test/

      - name: Smoke-test Argon demo
        run: magic run mojo run main.mojo examples/argon.json
