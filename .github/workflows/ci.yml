name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Mojo (via pixi)
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          manifest-path: mojoproject.toml

      - name: Run unit and integration tests
        run: pixi run test

      - name: Smoke-test Argon demo
        run: pixi run run-argon
