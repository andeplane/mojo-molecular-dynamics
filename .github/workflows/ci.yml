name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv and install Mojo
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install --pre 'mojo==1.0.0b1'

      - name: Run unit and integration tests
        run: |
          source .venv/bin/activate
          for t in atom ghost neighbor lj vashishta integrator integration; do
            mojo run -I . "test/test_${t}.mojo"
          done

      - name: Smoke-test Argon demo
        run: |
          source .venv/bin/activate
          mojo run main.mojo examples/argon.json

      - name: Smoke-test SiO2 demo
        run: |
          source .venv/bin/activate
          mojo run main.mojo examples/sio2.json
