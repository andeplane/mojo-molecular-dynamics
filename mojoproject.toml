[project]
name = "mojo-md"
version = "0.1.0"
description = "Molecular dynamics simulator in Mojo"
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
test      = "mojo test test/"
run-argon = "mojo run main.mojo examples/argon.json"
run-sio2  = "mojo run main.mojo examples/sio2.json"

[dependencies]
max = ">=25.3,<26"
