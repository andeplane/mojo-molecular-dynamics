[project]
name = "mojo-md"
version = "0.1.0"
description = "Molecular dynamics simulator in Mojo"
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
test      = "mojo run -I . test/test_atom.mojo && mojo run -I . test/test_ghost.mojo && mojo run -I . test/test_neighbor.mojo && mojo run -I . test/test_lj.mojo && mojo run -I . test/test_vashishta.mojo && mojo run -I . test/test_integrator.mojo && mojo run -I . test/test_integration.mojo"
run-argon = "mojo run main.mojo examples/argon.json"
run-sio2  = "mojo run main.mojo examples/sio2.json"

[dependencies]
max = ">=25.3,<26"
